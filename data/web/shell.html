/*{{GITHUB_CSS}}*/

html, body {
  margin: 0;
  padding: 0;
  background-color: var(--bgColor-default, #ffffff);
  color: var(--fgColor-default, #1f2328);
}

#output {
  box-sizing: border-box;
  max-width: 900px;
  margin: 0 auto;
  padding: 24px 32px 64px;
  user-select: text;
  -webkit-user-select: text;
}

/* github-markdown.css already colours mark per theme; this tells a comment's mark from an authored one. */
.markdown-body mark.mdex-comment {
  border-bottom: 2px solid var(--borderColor-attention-emphasis, #9a6700);
  cursor: pointer;
}

/* Coverage tints the text and numbers it with a badge, so a comment's underline stays distinct where they overlap.
   A quote that names its source tints like the ticket text it quotes; a <q> without cite keeps the browser's look. */
.markdown-body mark.mdex-covered,
.markdown-body q[cite]:not([cite=""]) {
  background-color: color-mix(in srgb, var(--fgColor-accent, #0969da) 18%, transparent);
}

/* The badge is generated content, so it is neither selectable nor part of the text that quotes are matched in. */
.markdown-body mark.mdex-badge::after {
  content: attr(data-n);
  margin-left: 3px;
  padding: 0 5px;
  border-radius: 8px;
  font: 600 0.7em/1.6 system-ui, sans-serif;
  vertical-align: 0.25em;
  color: var(--bgColor-default, #ffffff);
  background-color: var(--fgColor-accent, #0969da);
}

/* Quieter than covered text, so a gap left on purpose reads differently from a forgotten one. */
.markdown-body mark.mdex-gap {
  background-color: var(--bgColor-neutral-muted, #818b981f);
  color: var(--fgColor-muted, #59636e);
}

/* The bar sits in the page's left padding, beside the block rather than in it; a list item's sits left of its bullet. */
.markdown-body .mdex-uncovered {
  position: relative;
}

.markdown-body .mdex-uncovered::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: -14px;
  width: 3px;
  border-radius: 2px;
  background-color: var(--borderColor-attention-emphasis, #9a6700);
}

.markdown-body li.mdex-uncovered::before {
  left: calc(-2em - 14px);
}

#mdex-comment {
  position: absolute;
  z-index: 10;
  padding: 2px 10px;
  font: 13px/1.5 system-ui, sans-serif;
  color: var(--fgColor-default, #1f2328);
  background-color: var(--bgColor-muted, #f6f8fa);
  border: 1px solid var(--borderColor-default, #d1d9e0);
  border-radius: 6px;
  box-shadow: 0 2px 8px #1f232826;
  cursor: pointer;
}

#mdex-comment:hover {
  /* The hover tint is translucent, so it sits on the opaque background as a layer; alone it lets the text underneath show through. */
  background-image: linear-gradient(var(--bgColor-neutral-muted, #818b981f), var(--bgColor-neutral-muted, #818b981f));
}
</style>

<body>
<div id="output" class="markdown-body"></div>
<button id="mdex-comment" type="button" hidden>Comment</button>

<script nonce="{{NONCE}}">
/*{{MARKED_JS}}*/
</script>

<script nonce="{{NONCE}}">
(function () {
  const output = document.getElementById("output");
  const commentButton = document.getElementById("mdex-comment");
  const exporters = [];
  const exportersById = {};

  marked.setOptions({ gfm: true, breaks: false });

  // marked's token `text` is HTML-escaped (James&#39;s). Exporters emit plain
  // text, not HTML, so they undo it at the point they read a token.
  function unescapeEntities(s) {
    return (s || "")
      .replace(/&lt;/g, "<")
      .replace(/&gt;/g, ">")
      .replace(/&quot;/g, '"')
      .replace(/&#0?39;/g, "'")
      .replace(/&amp;/g, "&");
  }

  // A plan copies its quotes from the ticket file, markdown syntax included; the page holds the text that syntax renders to.
  function renderedText(markdown) {
    return unescapeEntities(marked.parseInline(markdown).replace(/<[^>]*>/g, ""));
  }

  // The pieces of the nth match of a quote that may be copied from the ticket file: as written, else as the text its markdown renders to.
  function findCopiedQuote(flat, quote, n) {
    return findQuote(flat, quote, n) || findQuote(flat, renderedText(quote), n);
  }

  function collapse(s) {
    return s.replace(/\s+/g, " ").trim();
  }

  // The concatenation of texts with every run of whitespace as one space, and
  // where each character came from: at[k] is { i, o }, an index into texts and
  // an offset in that text.
  function flatten(texts) {
    const chars = [];
    const at = [];
    texts.forEach(function (t, i) {
      for (let o = 0; o < t.length; o++) {
        const c = /\s/.test(t[o]) ? " " : t[o];
        if (c === " " && chars[chars.length - 1] === " ") continue;
        chars.push(c);
        at.push({ i: i, o: o });
      }
    });
    return { text: chars.join(""), at: at, texts: texts };
  }

  // Where each match of needle starts in text, overlapping matches included.
  function starts(text, needle) {
    const found = [];
    for (let m = text.indexOf(needle); m !== -1; m = text.indexOf(needle, m + 1)) found.push(m);
    return found;
  }

  // Finds the nth (1-based, default 1) match of quote in flat, the flatten() of
  // some texts, whitespace collapsed on both sides, and returns the pieces of
  // those texts it covers as [{ i, start, end }] (i indexes the texts), or
  // null. With fewer matches than n it takes the last, as an earlier copy may
  // have been removed. A quote can span texts: bold, links.
  function findQuote(flat, quote, n) {
    const needle = collapse(quote);
    if (!needle) return null;
    const found = starts(flat.text, needle);
    if (!found.length) return null;
    const m = found[Math.max(1, Math.min(n || 1, found.length)) - 1];
    const first = flat.at[m];
    const last = flat.at[m + needle.length - 1];
    const pieces = [];
    for (let i = first.i; i <= last.i; i++) {
      const start = i === first.i ? first.o : 0;
      const end = i === last.i ? last.o + 1 : flat.texts[i].length;
      if (start < end) pieces.push({ i: i, start: start, end: end });
    }
    return pieces;
  }

  // The page's text nodes in order, and each <br> among them: a hard line
  // break is whitespace in the selection's text, so it is in the page's.
  // shortcut: only <br>; marked puts a newline between its own blocks, so only
  // raw HTML blocks written with nothing between them still join, add them if seen.
  function textNodes() {
    const walker = document.createTreeWalker(output, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    const nodes = [];
    for (let node; (node = walker.nextNode());) if (node.nodeType === 3 || node.nodeName === "BR") nodes.push(node);
    return nodes;
  }

  function textOf(node) {
    return node.nodeType === 3 ? node.data : "\n";
  }

  // Returns the text node holding the wrapped text. decorate(mark, stretch) sets what kind of mark it is.
  function wrap(node, start, end, stretch, decorate) {
    const inner = node.splitText(start);
    inner.splitText(end - start);
    const mark = document.createElement("mark");
    decorate(mark, stretch);
    inner.parentNode.replaceChild(mark, inner);
    mark.appendChild(inner);
    return inner;
  }

  function commentMark(mark, stretch) {
    mark.className = "mdex-comment";
    mark.dataset.id = stretch.item.id;
    mark.title = stretch.item.title;
  }

  // The last piece of a quote is flagged badge. Pieces are wrapped right to left, so the first mark made for a flagged stretch is the one that shows the badge.
  function coverageMark(mark, stretch) {
    mark.className = stretch.item.cls + (stretch.badge ? " mdex-badge" : "");
    stretch.badge = false;
    if (stretch.item.n) mark.dataset.n = stretch.item.n;
    mark.title = stretch.item.title;
  }

  // Marks each stretch [{ start, end, item }] of one text node. The node is cut
  // at every edge and the stretches wrapped from the right, so the offsets of
  // those still to wrap stay valid; a part that several items cover gets a
  // mark from each, the first item outermost.
  function wrapStretches(node, stretches, decorate) {
    const cuts = [...new Set(stretches.flatMap(function (g) { return [g.start, g.end]; }))].sort(function (a, b) { return a - b; });
    for (let k = cuts.length - 2; k >= 0; k--) {
      let target = node, start = cuts[k], end = cuts[k + 1];
      stretches.filter(function (g) { return g.start <= start && end <= g.end; }).forEach(function (g) {
        target = wrap(target, start, end, g, decorate);
        start = 0;
        end = target.data.length;
      });
    }
  }

  // The nodes inside an element that belong to it and not to a list item nested in it.
  function ownNodes(element) {
    return Array.from(element.childNodes).flatMap(function (n) { return n.nodeName === "LI" ? [] : [n, ...ownNodes(n)]; });
  }

  // The paragraphs and list items under node. A list item that holds paragraphs is left to them.
  function collectBlocks(node, blocks) {
    if (node.nodeName === "P") {
      blocks.push(node);
      return;
    }
    const children = Array.from(node.childNodes).filter(function (n) { return n.nodeType === 1; });
    if (node.nodeName === "LI" && !children.some(function (n) { return n.nodeName === "P"; })) blocks.push(node);
    children.forEach(function (n) { collectBlocks(n, blocks); });
  }

  function treeText(node) {
    return node.nodeType === 3 ? node.data : Array.from(node.childNodes).map(treeText).join("");
  }

  // The ticket body as ticket2md writes a ticket: a title, a table of metadata, the description, then a Comments
  // heading and the comments. A document without the title or the table starts at its first block.
  // shortcut: a description that has a "## Comments" heading of its own ends there; ticket2md has no marker to tell it from the real one.
  function descriptionRoots() {
    const top = Array.from(output.childNodes).filter(function (n) { return n.nodeType === 1; });
    let i = 0;
    if (top[i]?.nodeName === "H1") i++;
    if (top[i]?.nodeName === "TABLE") i++;
    const roots = [];
    for (; i < top.length && !(top[i].nodeName === "H2" && collapse(treeText(top[i])) === "Comments"); i++) roots.push(top[i]);
    return roots;
  }

  function descriptionBlocks() {
    const blocks = [];
    descriptionRoots().forEach(function (root) { collectBlocks(root, blocks); });
    return blocks;
  }

  // Finds a quote copied from the ticket file, in the description first, so a phrase that the title, the metadata table
  // or a comment also holds does not take the mark; only a quote the description lacks is looked for in the whole page.
  // Takes the page's text nodes and returns a function of (quote, n) that works as findCopiedQuote does.
  function ticketFinder(nodes) {
    const roots = descriptionRoots();
    // Text outside the description is one character that no quote holds, so a quote cannot run into it from the description.
    const described = flatten(nodes.map(function (node) { return roots.some(function (r) { return r.contains(node); }) ? textOf(node) : "\0"; }));
    const whole = flatten(nodes.map(textOf));
    return function (quote, n) { return findCopiedQuote(described, quote, n) || findCopiedQuote(whole, quote, n); };
  }

  // The selected text inside the rendered output, whitespace collapsed, or "".
  function selectedQuote() {
    const selection = window.getSelection();
    if (!selection || selection.isCollapsed || !selection.rangeCount) return "";
    const range = selection.getRangeAt(0);
    return output.contains(range.commonAncestorContainer) ? collapse(selection.toString()) : "";
  }

  // Which match of quote (already collapsed) in the rendered text the range
  // starts at, 1-based: the matches that start before it, plus one.
  function occurrenceAt(range, quote) {
    const nodes = textNodes();
    const flat = flatten(nodes.map(textOf));
    return starts(flat.text, quote).filter(function (m) {
      return range.comparePoint(nodes[flat.at[m].i], flat.at[m].o) < 0;
    }).length + 1;
  }

  function showCommentButton() {
    const selection = window.getSelection();
    if (!selectedQuote()) return;
    const rects = selection.getRangeAt(0).getClientRects();
    const r = rects[rects.length - 1] || selection.getRangeAt(0).getBoundingClientRect();
    commentButton.style.top = window.scrollY + Math.min(r.bottom + 6, window.innerHeight - commentButton.offsetHeight - 8) + "px";
    commentButton.style.left = window.scrollX + Math.max(8, Math.min(r.right, window.innerWidth - commentButton.offsetWidth - 8)) + "px";
    commentButton.hidden = false;
  }

  // A page without the handler (tests, older build) ignores the message.
  function post(message) {
    window.webkit?.messageHandlers?.mdex?.postMessage(message);
  }

  function postComment() {
    const quote = selectedQuote();
    if (!quote) return false;
    const occurrence = occurrenceAt(window.getSelection().getRangeAt(0), quote);
    commentButton.hidden = true;
    post({ type: "comment", quote: quote, occurrence: occurrence });
    return true;
  }

  commentButton.addEventListener("mousedown", function (e) { e.preventDefault(); }); // keeps the selection
  commentButton.addEventListener("click", postComment);
  // A click that ends a text selection is for the Comment button, so only a click without one opens the comment.
  output.addEventListener("click", function (e) {
    const mark = e.target.closest("mark.mdex-comment");
    if (mark && !selectedQuote()) post({ type: "open", id: mark.dataset.id });
  });
  // Deferred, so a click that clears the selection is seen as empty.
  // A click on the button ends with a mouseup on it, before the click hides it; showing it again would let a second click post the comment twice.
  document.addEventListener("mouseup", function (e) { if (!commentButton.contains(e.target)) setTimeout(showCommentButton); });
  document.addEventListener("selectionchange", function () {
    if (!selectedQuote()) commentButton.hidden = true;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "c" || e.ctrlKey || e.metaKey || e.altKey || e.target.closest?.("input, textarea, select")) return;
    if (postComment()) e.preventDefault();
  });

  window.mdex = {
    unescape: unescapeEntities,

    render(md) {
      output.innerHTML = marked.parse(md || "");
      output.querySelectorAll("q").forEach(function (q) {
        if (q.getAttribute("cite") && !q.hasAttribute("title")) q.setAttribute("title", "Quoted from " + q.getAttribute("cite"));
      });
      return "";
    },

    // Selects the nth (1-based) case-insensitive occurrence of text in the
    // rendered output and scrolls it into view; past the last, the last. Found
    // as markQuotes finds a quote, so the text may span marks, bold or links.
    // shortcut: counts rendered text only, so a source match inside markdown
    // syntax or a URL shifts the count; source positions from marked fix it.
    reveal(text, n) {
      const nodes = textNodes();
      const pieces = findQuote(flatten(nodes.map(function (node) { return textOf(node).toLowerCase(); })), text.toLowerCase(), n);
      if (!pieces) return "";
      const first = pieces[0];
      const last = pieces[pieces.length - 1];
      const range = document.createRange();
      range.setStart(nodes[first.i], first.start);
      range.setEnd(nodes[last.i], last.end);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      window.scrollBy(0, range.getBoundingClientRect().top - window.innerHeight * 0.3);
      return "";
    },

    // Takes [{ id, quote, occurrence, title }]. Wraps the occurrence-th
    // (1-based, default 1; the last when there are fewer) occurrence of each
    // quote (rendered text, whitespace collapsed) in <mark class="mdex-comment">,
    // every piece carrying the id (clicking it posts { type: "open", id }) and
    // the title (the tooltip), and returns one boolean per item: whether it was
    // found. render() replaces the content, so call this after every render;
    // it clears its earlier marks first.
    markQuotes(items) {
      output.querySelectorAll("mark.mdex-comment").forEach(function (m) { m.replaceWith(...m.childNodes); });
      output.normalize();
      // Marks split text nodes but never change the text, so every quote is
      // located on the unmarked nodes first and wrapped afterwards.
      const nodes = textNodes();
      const flat = flatten(nodes.map(textOf));
      const stretches = nodes.map(function () { return []; });
      const found = (items || []).map(function (item) {
        const pieces = findQuote(flat, item.quote, item.occurrence);
        (pieces || []).forEach(function (p) {
          if (nodes[p.i].nodeType === 3) stretches[p.i].push({ start: p.start, end: p.end, item: item });
        });
        return !!pieces;
      });
      stretches.forEach(function (list, i) { if (list.length) wrapStretches(nodes[i], list, commentMark); });
      return found;
    },

    // Takes { covered: [{ n, quote, title }], gaps: [{ quote, reason }] }, or null for no plan, and shows what a
    // plan's criteria cover of the ticket. Marks the first occurrence of each quote (rendered text, whitespace
    // collapsed): covered text with the criterion's number and its text as the tooltip, a gap with its reason.
    // A quote copied from the ticket file may hold markdown syntax; if it is not found as written, it is read as
    // the text that syntax renders to. A paragraph or list item of the description with a mark of neither kind
    // gets the mdex-uncovered class. Returns { missing: [{ n, quote }] }, the quotes the page does not hold
    // (n is 0 for a gap). Replaces the marks of an earlier call and leaves comment marks alone.
    markCoverage(plan) {
      output.querySelectorAll("mark.mdex-covered, mark.mdex-gap").forEach(function (m) { m.replaceWith(...m.childNodes); });
      output.normalize();
      output.querySelectorAll(".mdex-uncovered").forEach(function (e) { e.classList.toggle("mdex-uncovered", false); });
      const missing = [];
      if (!plan) return { missing: missing };
      const items = (plan.covered || []).map(function (c) { return { cls: "mdex-covered", n: c.n, quote: c.quote, title: c.title }; })
        .concat((plan.gaps || []).map(function (g) { return { cls: "mdex-gap", n: 0, quote: g.quote, title: g.reason }; }));
      const nodes = textNodes();
      const find = ticketFinder(nodes);
      const stretches = nodes.map(function () { return []; });
      items.forEach(function (item) {
        const pieces = find(item.quote, 1);
        if (!pieces) {
          missing.push({ n: item.n, quote: item.quote });
          return;
        }
        pieces.forEach(function (p, k) {
          if (nodes[p.i].nodeType === 3) stretches[p.i].push({ start: p.start, end: p.end, item: item, badge: item.n > 0 && k === pieces.length - 1 });
        });
      });
      stretches.forEach(function (list, i) { if (list.length) wrapStretches(nodes[i], list, coverageMark); });
      descriptionBlocks().forEach(function (block) {
        const own = ownNodes(block);
        const text = own.some(function (n) { return n.nodeType === 3 && n.data.trim(); });
        const marked = own.some(function (n) { return n.nodeType === 1 && /\bmdex-(covered|gap)\b/.test(n.className); });
        block.classList.toggle("mdex-uncovered", text && !marked);
      });
      return { missing: missing };
    },

    // Scrolls the first piece of the occurrence-th occurrence of a quote
    // (rendered text, whitespace collapsed; same rule as markQuotes) to the
    // middle of the window, selects nothing, and returns whether it was found.
    // Unlike reveal(), the quote may span bold, links or line breaks. With ticket
    // set, the quote is copied from the ticket file, markdown syntax included, and
    // is found where markCoverage marks it; a comment's quote is rendered text.
    revealQuote(quote, occurrence, ticket) {
      const nodes = textNodes();
      const pieces = ticket ? ticketFinder(nodes)(quote, occurrence) : findQuote(flatten(nodes.map(textOf)), quote, occurrence);
      if (!pieces) return false;
      const range = document.createRange();
      range.setStart(nodes[pieces[0].i], pieces[0].start);
      range.setEnd(nodes[pieces[0].i], pieces[0].end);
      const r = range.getBoundingClientRect();
      window.scrollBy(0, r.top + r.height / 2 - window.innerHeight / 2);
      return true;
    },

    list() {
      return JSON.stringify(
        exporters.map(function (e) { return { id: e.id, label: e.label }; })
      );
    },

    run(id, md) {
      const exporter = exportersById[id];
      if (!exporter) return "";
      const tokens = marked.lexer(md || "");
      return JSON.stringify({
        text: exporter.fn(tokens, md || ""),
        html: exporter.html ? exporter.html(tokens, md || "") : "",
      });
    },

    registerExporter(id, label, fn, htmlFn) {
      if (exportersById[id]) {
        // Re-registering an id (e.g. a plugin reload) replaces it in place
        // rather than duplicating it in list() order.
        const existing = exportersById[id];
        existing.label = label;
        existing.fn = fn;
        existing.html = htmlFn;
        return;
      }
      const exporter = { id: id, label: label, fn: fn, html: htmlFn };
      exporters.push(exporter);
      exportersById[id] = exporter;
    },

    setTheme(dark) {
      document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    },
  };
})();
</script>
